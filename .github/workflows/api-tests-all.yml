name: Run all tests
run-name: ${{ github.actor }} is running all api tests on ${{ github.ref_name }} branch
on:
  push:
    branches:
      - main
      - 'feat/*'
  pull_request:
      branches:
        - main
        - 'feat/*'
jobs:
  Run-All-Tests:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub"
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Verify installed dependencies
        run: |
          pip list
      - run: echo "The ${{ github.repository }} repository ${{ github.ref }} branch has been cloned to the runner."
      - run: echo "The workflow is now ready to test your code on the runner."
      - run: echo "Running all tests..."
      - name: Run all tests
        run: |
          python -m pytest --no-header -v -s
      - run: echo "This job's status is ${{ job.status }}."
